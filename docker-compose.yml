services:
  jdweb:
    # Published image works with any JDWEB2_BASE_PATH at runtime (no rebuild).
    image: ghcr.io/krate-apps/jdweb:1.2.2
    # Optional local build (also no base-path rebuild required):
    build:
      context: .
    ports:
      - "${JDWEB2_PORT:-8787}:8787"
    env_file:
      - path: .env
        required: false
    environment:
      JDWEB2_HOST: 0.0.0.0
      JDWEB2_PORT: 8787
      # Public URL prefix — recommended /jdweb (synced into Settings on boot)
      JDWEB2_BASE_PATH: ${JDWEB2_BASE_PATH:-}
      JDWEB2_DB_PATH: /data/jdweb.sqlite
      JDWEB2_STAGING_DIR: /data/staging
      JDWEB2_MOVIES_DIR: /data/library/movies
      JDWEB2_SHOWS_DIR: /data/library/shows
      JDWEB2_OTHER_DIR: /data/library/other
    volumes:
      # Writable by container user node (UID 1000): chown -R 1000:1000 ./data
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787'+(process.env.JDWEB2_BASE_PATH||'')+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
