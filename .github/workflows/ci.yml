name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter ./server test
      - run: pnpm build
      - run: rm -f data/e2e.sqlite data/e2e.sqlite-*
      - run: pnpm test:e2e
        env:
          CI: true
          MOCK_JD_PORT: 13128
      - run: pnpm dlx playwright@1.51.0 install --with-deps chromium
      - run: pnpm test:e2e:ui
        env:
          CI: true
          MOCK_JD_PORT: 13128
