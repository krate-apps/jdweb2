name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

# One pipeline per ref: CI and release never overlap; do not cancel an in-flight release.
concurrency:
  group: jdweb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PLAYWRIGHT_VERSION: 1.61.0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.7.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm --filter ./server test
      - run: pnpm build

      - run: rm -f data/e2e.sqlite data/e2e.sqlite-*
      - run: pnpm test:e2e
        env:
          CI: true
          MOCK_JD_PORT: 13128

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm dlx "@playwright/test@${{ env.PLAYWRIGHT_VERSION }}" install --with-deps chromium

      - name: Install Playwright OS deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm dlx "@playwright/test@${{ env.PLAYWRIGHT_VERSION }}" install-deps chromium

      - run: pnpm test:e2e:ui
        env:
          CI: true
          MOCK_JD_PORT: 13128

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    outputs:
      published: ${{ steps.meta.outputs.published }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v6
        with:
          version: 9.7.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: pnpm exec semantic-release

      - name: Export release metadata
        id: meta
        run: |
          if [ -f .release-version ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=$(cat .release-version)" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  docker:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/krate-apps/jdweb:${{ needs.release.outputs.version }}
            ghcr.io/krate-apps/jdweb:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-develop:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push develop
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/krate-apps/jdweb:develop
            ghcr.io/krate-apps/jdweb:develop-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
